plugins {
    id "com.android.application"
}

// Clé de signature : variables d'environnement (secrets GitHub) si présentes,
// Clé scolaris-signature.keystore fournie avec le projet ; son mot de passe vient des secrets GitHub.
def cleFichier = System.getenv("SCOLARIS_KEYSTORE") ?: "scolaris-signature.keystore"  // dans le dépôt, protégé par le mot de passe des secrets
def cleMdp = System.getenv("SCOLARIS_KEYSTORE_PASSWORD") ?: ""
def cleAlias = System.getenv("SCOLARIS_KEY_ALIAS") ?: "scolaris"
def cleAliasMdp = System.getenv("SCOLARIS_KEY_PASSWORD") ?: cleMdp

android {
    namespace "bj.scolaris.app"
    compileSdk 34

    defaultConfig {
        applicationId "bj.scolaris.app"
        minSdk 24
        targetSdk 34
        versionCode 63
        versionName "2.4.4"
    }

    signingConfigs {
        release {
            storeFile file(cleFichier)
            storePassword cleMdp
            keyAlias cleAlias
            keyPassword cleAliasMdp
            // v1.6 : signatures v1 + v2 + v3 (certains téléphones refusent un APK signé seulement en v2)
            enableV1Signing true
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}
